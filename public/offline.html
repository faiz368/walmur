<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#041c39" />
        <title>Sedang Offline - Portal Wali Murid</title>
        <style>
            * { box-sizing: border-box; }
            html, body { height: 100%; }
            body {
                margin: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1.5rem;
                min-height: 100vh;
                font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
                color: #041c39;
                background: linear-gradient(180deg, #ffffff 0%, #f3f7ee 100%);
                -webkit-text-size-adjust: 100%;
            }
            .card {
                width: 100%;
                max-width: 26rem;
                text-align: center;
                background: #ffffff;
                border: 1px solid #e5e7eb;
                border-radius: 1.75rem;
                padding: 2.5rem 1.75rem;
                box-shadow: 0 25px 50px -12px rgba(4, 28, 57, 0.18);
            }
            .logo {
                height: 6rem;
                width: auto;
                object-fit: contain;
                margin: 0 auto 1.25rem;
                display: block;
            }
            .icon {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 3.5rem;
                height: 3.5rem;
                border-radius: 1rem;
                background: #041c39;
                color: #84be59;
                margin-bottom: 1rem;
            }
            h1 {
                font-size: 1.375rem;
                font-weight: 800;
                letter-spacing: -0.01em;
                margin: 0 0 0.5rem;
            }
            p {
                font-size: 0.875rem;
                line-height: 1.6;
                color: #4b5563;
                margin: 0 0 1.5rem;
            }
            button {
                width: 100%;
                border: 0;
                border-radius: 0.9rem;
                background: #6da444;
                color: #ffffff;
                font-size: 1rem;
                font-weight: 700;
                padding: 0.85rem 1rem;
                cursor: pointer;
                transition: background-color 150ms ease;
            }
            button:hover { background: #5b8d37; }
            .hint {
                margin-top: 1.25rem;
                font-size: 0.75rem;
                color: #9ca3af;
            }
        </style>
    </head>
    <body>
        <main class="card">
            <img class="logo" src="/images/logo-walmur-emblem.png" alt="Portal Wali Murid" />
            <span class="icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M3 10.5l9-6 9 6m-14.25 0v5.25a3.75 3.75 0 0 0 3.75 3.75h4.5a3.75 3.75 0 0 0 3.75-3.75V10.5" />
                </svg>
            </span>
            <h1>Koneksi Terputus</h1>
            <p>
                Portal Wali Murid memerlukan koneksi internet untuk menampilkan
                laporan anak Anda. Periksa jaringan Anda, lalu coba lagi.
            </p>
            <button type="button" onclick="window.location.reload()">Coba Lagi</button>
            <p class="hint">Data laporan tidak disimpan di perangkat ini demi keamanan.</p>
        </main>
    </body>
</html>
